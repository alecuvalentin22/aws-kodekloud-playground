# Argo CD UI/API through RKE2's bundled ingress-nginx.
# argocd-server serves TLS itself (self-signed), so nginx must speak HTTPS to
# the backend; the browser-facing certificate is nginx's default one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https
