# Wave 2. Prometheus + Alertmanager + Grafana + the CRDs (ServiceMonitor etc.).
# Chart pin = KPS_VERSION in versions.env (app v0.93.1). Values live in
# homelab/platform/values/kube-prometheus-stack.yaml, pulled in with Argo's
# multiple-sources `$values` ref so the file can be read and diffed as plain
# YAML instead of an indented block inside an Application.
#
# Prerequisite (README step 3): Secret observability/grafana-admin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/homelab/platform/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/alecuvalentin22/aws-kodekloud-playground.git
      targetRevision: feat/playground
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - FailOnSharedResource=true
      - SkipDryRunOnMissingResource=true
