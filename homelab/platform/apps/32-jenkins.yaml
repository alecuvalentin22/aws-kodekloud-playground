# Wave 3. Jenkins. Chart pin = JENKINS_CHART in versions.env (controller 2.580.1
# LTS, jdk25). Semantics from ci/jenkins/values.yaml; the homelab differences
# are listed at the top of values/jenkins.yaml.
#
# Prerequisite (README step 3): Secret jenkins/jenkins-admin.
# The in-cluster registry (apps/30-registry) is the image target.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.9.68
      helm:
        releaseName: jenkins
        valueFiles:
          - $values/homelab/platform/values/jenkins.yaml
    - repoURL: https://github.com/alecuvalentin22/aws-kodekloud-playground.git
      targetRevision: feat/playground
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - FailOnSharedResource=true
