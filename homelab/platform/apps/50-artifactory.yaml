# Artifactory OSS. Chart pin = ARTIFACTORY_CHART in versions.env
# (jfrog/artifactory-oss, app 7.161.26). See values/artifactory.yaml for what OSS
# can and cannot host, and for the memory sizing it was OOMKilled on before.
#
# Prerequisites (README step 2): Secrets artifactory/artifactory-keys,
# artifactory/artifactory-admin, artifactory/artifactory-postgresql.
#
# Wave 5, the LAST wave, on purpose. It is the slowest thing in the stack to
# start (several containers plus PostgreSQL) and the likeliest to fail on a first
# run. Argo waits for a wave to be Healthy before starting the next, so as wave 3
# it would have held Backstage (wave 4) back; as the last wave a slow or failed
# Artifactory blocks nothing else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artifactory
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: artifactory
  sources:
    - repoURL: https://charts.jfrog.io
      chart: artifactory-oss
      targetRevision: 107.161.26
      helm:
        releaseName: artifactory
        valueFiles:
          - $values/homelab/platform/values/artifactory.yaml
    - repoURL: https://github.com/alecuvalentin22/aws-kodekloud-playground.git
      targetRevision: feat/playground
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - FailOnSharedResource=true
