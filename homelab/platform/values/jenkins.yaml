# Jenkins on the home-lab RKE2 cluster. Derived from ci/jenkins/values.yaml (the
# EKS one); read the comments there for WHY the plugin pins, initializeOnce and
# numExecutors: 0 exist. Only the DIFFERENCES from the EKS file are explained
# here:
#
#   storageClass  gp3 -> local-path (node-local; the controller is pinned to the
#                 node its PVC landed on)
#   exposure      NodePort 30094 -> Ingress jenkins.127.0.0.1.nip.io
#   shared lib    defaultVersion main -> feat/playground (this branch)
#   registry      ECR -> in-cluster registry:3 (PLATFORM_REGISTRY below)
#   admin         generated password -> Secret jenkins/jenkins-admin (README)
controller:
  image:
    tag: "2.580.1-jdk25"
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2Gi}
  # Credentials from a Secret the deploy step creates, keys jenkins-admin-user
  # and jenkins-admin-password. The chart would otherwise render a random
  # password at template time, which Argo sees as drift on every refresh.
  admin:
    existingSecret: jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  numExecutors: 0
  initializeOnce: true
  installPlugins:
    - kubernetes:4560.vc25b_83890c34
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.11.0
    - configuration-as-code:2136.veb_3a_554550b_f
  additionalPlugins:
    - job-dsl:3732.v9a_c49a_61a_313
    - pipeline-groovy-lib:822.vc95f70dea_db_7
    - timestamper:1.30
    - pipeline-utility-steps:3.810.va_7672d206740
    - ws-cleanup:0.49
    - pipeline-stage-view:2.41
    - pipeline-graph-view:1053.v9df19e6ceed2
    - credentials-binding:728.v902a_273b_8947
    - junit:1442.vb_b_a_467df2767
  # JCasC reload sidecar: bounded, because the chart default is no limit.
  sidecars:
    configAutoReload:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false

  serviceType: ClusterIP
  # Jenkins' own idea of its URL, used in links and redirects. The browser
  # reaches it through the SSH tunnel on :8443, so the port is part of the URL.
  # The Wi-Fi name (manifests/lan-ingress), plain http by the user's choice.
  jenkinsUrl: http://jenkins.192.168.0.23.nip.io
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.127.0.0.1.nip.io
    tls:
      - hosts: [jenkins.127.0.0.1.nip.io]

  JCasC:
    defaultConfig: true
    configScripts:
      shared-library: |
        unclassified:
          globalLibraries:
            libraries:
              - name: platform-lib
                defaultVersion: feat/playground
                implicit: false
                allowVersionOverride: true
                includeInChangesets: false
                retriever:
                  modernSCM:
                    libraryPath: ci/shared-library/
                    scm:
                      git:
                        remote: https://github.com/alecuvalentin22/aws-kodekloud-playground.git

      # Read by ci/shared-library/vars/standardPipeline.groovy (registry
      # resolution order: Jenkinsfile, then PLATFORM_REGISTRY, then ECR) and by
      # buildImage.groovy (PLATFORM_REGISTRY_INSECURE -> registry.insecure=true
      # on the BuildKit push).
      #
      # 10.77.0.31:30500 is NodePort 30500 of the in-cluster registry, addressed
      # by NODE IP and not by Service DNS, because the SAME string is later used
      # by containerd on the nodes to pull the image into the demo-api pod, and
      # node-level containerd cannot resolve cluster DNS. For the pull to work
      # over plain http every node needs the registries.yaml mirror from
      # README.md step 0. Any of the three node IPs would do (kube-proxy serves
      # NodePorts everywhere); .31 is just the stable one.
      registry-env: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: PLATFORM_REGISTRY
                    value: "10.77.0.31:30500"
                  - key: PLATFORM_REGISTRY_INSECURE
                    value: "true"

      # Multibranch pipeline for demo-api; every branch with
      # ci/apps/demo-api/Jenkinsfile gets CI, only main deploys. See the EKS
      # values file for why a plain git branch source and not github-branch-source.
      jobs: |
        jobs:
          - script: >
              multibranchPipelineJob('demo-api') {
                displayName('demo-api')
                description('Built by the platform-lib shared library. Seeded by Job DSL.')
                branchSources {
                  git {
                    id('demo-api-src')
                    remote('https://github.com/alecuvalentin22/aws-kodekloud-playground.git')
                  }
                }
                factory {
                  workflowBranchProjectFactory {
                    scriptPath('ci/apps/demo-api/Jenkinsfile')
                  }
                }
                triggers {
                  periodicFolderTrigger { interval('5m') }
                }
                orphanedItemStrategy {
                  discardOldItems { numToKeep(5) }
                }
              }

agent:
  enabled: true
  namespace: jenkins
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# The agent pod template (ci/shared-library/resources/podtemplates/build.yaml)
# runs as ServiceAccount jenkins-agent. That account, and its deploy rights in
# demo-ci, come from manifests/jenkins/rbac.yaml (app 31-jenkins-rbac).
serviceAccountAgent:
  create: false
  name: jenkins-agent

persistence:
  enabled: true
  storageClass: local-path
  size: 8Gi

serviceAccount:
  create: true
  name: jenkins
