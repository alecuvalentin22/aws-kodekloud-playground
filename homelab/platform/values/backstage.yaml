# Backstage on the home-lab cluster. Derived from ci/backstage/values.yaml; read
# the comments there for the history of each setting. What differs:
#
#   exposure   NodePort 30096 -> Ingress backstage.127.0.0.1.nip.io (HTTPS)
#   http-only workarounds REMOVED. The EKS file turned off notifications, search,
#              the custom sidebar, the permission framework and the CSP
#              `upgrade-insecure-requests` directive, all to survive plain http
#              on a node IP (no secure context -> crypto.randomUUID missing).
#              Here the browser uses https (ingress-nginx's self-signed
#              certificate, accepted once), which IS a secure context, so the
#              file's own advice applies: "behind TLS, delete every `false`
#              line". NOT VERIFIED -- if the page blanks or the sidebar throws,
#              restore the `extensions:` block and `permission.enabled: false`
#              and `csp.upgrade-insecure-requests: false` from the EKS file.
#   cluster    name eks -> rke2
#   catalog    main -> feat/playground
backstage:
  args:
    - --config
    - app-config.yaml
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: "1.55.2"
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  appConfig:
    app:
      title: Platform Lab
      # The browser is told to call the backend at backend.baseUrl, so both must
      # be the address the BROWSER uses: the SSH tunnel's port 8443, not the
      # Ingress' 443.
      baseUrl: https://backstage.127.0.0.1.nip.io:8443
      extensions:
        # Repeated from the image's own app.extensions because Backstage
        # REPLACES arrays: this keeps the catalog mounted at / .
        - page:catalog:
            config:
              path: /
    organization:
      name: Platform Lab
    backend:
      baseUrl: https://backstage.127.0.0.1.nip.io:8443
      cors:
        origin: https://backstage.127.0.0.1.nip.io:8443
      # In-memory SQLite: the catalog is rebuilt from git on every start, which
      # is fine because git is its source of truth. Search indexes and
      # scaffolder history do not survive a restart.
      database:
        client: better-sqlite3
        connection: ':memory:'
    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: rke2
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              skipTLSVerify: true
              # No metrics-server on this cluster.
              skipMetricsLookup: true
      customResources:
        - group: argoproj.io
          apiVersion: v1alpha1
          plural: rollouts
    catalog:
      rules:
        - allow: [Component, System, Domain, API, Resource, Location, Group, User, Template]
      locations:
        - type: url
          target: https://github.com/alecuvalentin22/aws-kodekloud-playground/blob/feat/playground/catalog-info.yaml

# Created by apps/34-backstage-rbac (read-only; see manifests/backstage/rbac.yaml).
serviceAccount:
  create: false
  name: backstage

ingress:
  enabled: true
  className: nginx
  host: backstage.127.0.0.1.nip.io
  tls:
    enabled: true

postgresql:
  enabled: false
