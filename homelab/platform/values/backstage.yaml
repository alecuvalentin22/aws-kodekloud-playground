# Backstage on the home-lab cluster. Derived from ci/backstage/values.yaml; read
# the comments there for the history of each setting. What differs:
#
#   exposure   NodePort 30096 -> Ingress backstage.127.0.0.1.nip.io
#   http-only workarounds KEPT (decision 2026-10-16: the LAN front door is plain
#              http, no TLS, no local CA). Over http the browser has no secure
#              context, so crypto.randomUUID is missing: notifications, the
#              custom sidebar and search are switched off, the permission
#              framework is off (otherwise the Kubernetes tab says "Permission
#              required"), and the CSP `upgrade-insecure-requests` directive is
#              off (otherwise the browser rewrites script URLs to https and the
#              page is blank). Anything that only works over https is listed in
#              README.md "Not verified yet".
#   baseUrl    the address the BROWSER uses. Today that is the SSH tunnel
#              (https://...:8443); the LAN front door changes both baseUrls to
#              http://backstage.<lan-ip>.nip.io.
#   cluster    name eks -> rke2
#   catalog    main -> feat/playground
backstage:
  args:
    - --config
    - app-config.yaml
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: "1.55.2"
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  appConfig:
    app:
      title: Platform Lab
      # The browser is told to call the backend at backend.baseUrl, so both must
      # be the address the BROWSER uses: the SSH tunnel's port 8443, not the
      # Ingress' 443.
      # The Wi-Fi name (manifests/lan-ingress), plain http by the user's choice.
      baseUrl: http://backstage.192.168.1.153.nip.io
      # This list REPLACES the image's app.extensions (Backstage replaces arrays
      # rather than merging them), so the catalog-at-/ entry is repeated.
      extensions:
        - page:catalog:
            config:
              path: /
        - page:notifications: false
        - home-page-widget:notifications/unread-notifications: false
        # The image's custom sidebar hardcodes a notifications link; with the
        # page off it would throw "No path for routeRef{id=notifications.root}".
        - nav-content:app: false
        # Search also needs crypto.randomUUID. (NOT api:signals: core.storage
        # depends on it; turning it off broke catalog, api-docs and scaffolder.)
        - page:search: false
        - home-page-widget:search/search-bar: false
    organization:
      name: Platform Lab
    backend:
      baseUrl: http://backstage.192.168.1.153.nip.io
      cors:
        origin: http://backstage.192.168.1.153.nip.io
      # Required over plain http: the default CSP ends in
      # upgrade-insecure-requests, the browser rewrites every script URL to
      # https://, nothing serves that, and the page is blank with HTTP 200.
      csp:
        upgrade-insecure-requests: false
      # In-memory SQLite: the catalog is rebuilt from git on every start, which
      # is fine because git is its source of truth. Search indexes and
      # scaffolder history do not survive a restart.
      database:
        client: better-sqlite3
        connection: ':memory:'
    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    # Permission framework OFF, for plain http only: the Kubernetes tab checks
    # permissions in the browser, the check throws without a secure context, and
    # the tab shows "Permission required" although the backend would allow it.
    # Consequence: nothing is authorised per user; everyone signed in as guest
    # can do whatever the backend plugins let a guest do (see README).
    permission:
      enabled: false
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: rke2
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              skipTLSVerify: true
              # Metrics lookup skipped to keep the tab simple (RKE2 does ship
              # metrics-server; the ClusterRole already allows pods metrics).
              skipMetricsLookup: true
      # No customResources: the EKS values listed argoproj.io rollouts, but the
      # RKE2 cluster has no Argo Rollouts CRD, so every Kubernetes tab showed
      # "Warning: There was a problem retrieving Kubernetes objects ... rollouts
      # ... NOT_FOUND 404" (found in a browser test, 2026-10-16). Add the entry
      # back when Argo Rollouts is installed here.
    catalog:
      rules:
        - allow: [Component, System, Domain, API, Resource, Location, Group, User, Template]
      locations:
        - type: url
          target: https://github.com/alecuvalentin22/aws-kodekloud-playground/blob/feat/playground/catalog-info.yaml

# Created by apps/34-backstage-rbac (read-only; see manifests/backstage/rbac.yaml).
serviceAccount:
  create: false
  name: backstage

ingress:
  enabled: true
  className: nginx
  host: backstage.127.0.0.1.nip.io
  tls:
    enabled: true

postgresql:
  enabled: false
