# Headlamp: the Kubernetes web UI (kubernetes-sigs/headlamp; the old Kubernetes
# Dashboard project was archived and points here). Chart headlamp 0.45.0, released
# 2026-08-20 (0.46.0 is 2026-10-16: under two weeks old). App version = chart version.
#
# LOGIN. Headlamp normally asks every visitor for a Kubernetes token. Here it
# runs as its own ServiceAccount instead (unsafeUseServiceAccountToken), which
# the chart documents as safe ONLY behind an auth proxy -- so the Ingress below
# puts ingress-nginx basic auth in front: admin / the shared password, the same
# Secret format as the registry UI (key `auth`, htpasswd bcrypt), Secret
# `headlamp-auth` in namespace headlamp, created from the Mac, never in git
# (homelab/platform/README.md "Headlamp"). Without that Secret ingress-nginx
# answers 503: it fails closed, never open.
#
# WHAT THAT GRANTS: the ServiceAccount is bound to cluster-admin (chart
# default), so admin/<password> on the Wi-Fi = cluster-admin in a browser. That
# is the same reach Argo CD's admin already has (it can sync anything into this
# cluster) and the user's choice for this lab (2026-10-16: whole Wi-Fi, one
# short shared password). For a read-only UI set
# clusterRoleBinding.clusterRoleName: view.
config:
  inCluster: true
  inClusterContextName: homelab
  unsafeUseServiceAccountToken: true

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: headlamp-auth
    nginx.ingress.kubernetes.io/auth-realm: "Home lab Headlamp"
  hosts:
    - host: headlamp.192.168.0.23.nip.io
      paths:
        - path: /
          type: Prefix

resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {memory: 256Mi}
