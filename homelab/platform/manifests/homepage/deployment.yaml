apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      containers:
        - name: homepage
          # v2.4.0, released 2026-09-17 (v2.5.0 is 2026-10-10: under two weeks
          # old). The docs use :latest + Always; a pinned tag does not need that.
          image: ghcr.io/gethomepage/homepage:v2.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            # Widget credentials (HOMEPAGE_VAR_*), created by hand, never in git:
            # homelab/platform/README.md, "Start page and dashboards".
            # optional: Homepage starts without it; only the Grafana widget errors.
            - secretRef:
                name: homepage-widgets
                optional: true
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Host values Homepage's API proxy answers. The pod IP is for the
            # kubelet probe; the Service names for the blackbox probe; the other
            # two are what a browser on the Wi-Fi sends (no port: it is :80).
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.homepage.svc.cluster.local:3000,home.192.168.0.23.nip.io,192.168.0.23"
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          livenessProbe:
            httpGet: {path: /api/healthcheck, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /api/healthcheck, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {mountPath: /app/config/custom.js, name: homepage-config, subPath: custom.js}
            - {mountPath: /app/config/custom.css, name: homepage-config, subPath: custom.css}
            - {mountPath: /app/config/bookmarks.yaml, name: homepage-config, subPath: bookmarks.yaml}
            - {mountPath: /app/config/docker.yaml, name: homepage-config, subPath: docker.yaml}
            - {mountPath: /app/config/proxmox.yaml, name: homepage-config, subPath: proxmox.yaml}
            - {mountPath: /app/config/kubernetes.yaml, name: homepage-config, subPath: kubernetes.yaml}
            - {mountPath: /app/config/services.yaml, name: homepage-config, subPath: services.yaml}
            - {mountPath: /app/config/settings.yaml, name: homepage-config, subPath: settings.yaml}
            - {mountPath: /app/config/widgets.yaml, name: homepage-config, subPath: widgets.yaml}
            - {mountPath: /app/config/logs, name: logs}
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
