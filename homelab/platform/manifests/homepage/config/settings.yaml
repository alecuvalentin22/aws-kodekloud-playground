title: Home lab
description: RKE2 on three Incus VMs, delivered by Argo CD
theme: dark
color: slate
headerStyle: boxed
# A coloured dot per tile from `siteMonitor` (green = answered with <= 403,
# red = no answer or >= 404/5xx). The latency is in the dot's tooltip.
statusStyle: dot
hideVersion: true
useEqualHeights: true
layout:
  Platform:
    style: row
    columns: 3
  CI:
    style: row
    columns: 2
  Playground:
    style: row
    columns: 3
  Cluster:
    style: row
    columns: 2
