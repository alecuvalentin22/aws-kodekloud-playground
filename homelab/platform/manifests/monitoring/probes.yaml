# Uptime targets, one Probe per (app, layer); edit by hand.
# Two layers, because "the app is up" and "people can reach it" fail separately:
#   layer=in-cluster   the Service URL: the app answers, ingress/HAProxy not involved
#   layer=front-door   the Wi-Fi name (http://<tool>.192.168.1.153.nip.io, or the
#                      playground's NodePort) as a browser sends it: the pod goes
#                      out to the PC's 192.168.1.153, through HAProxy and
#                      ingress-nginx, and back to the app
# All use job="blackbox-http" (spec.jobName) so dashboards query one job, and the
# modules http_up / http_up_insecure of values/blackbox-exporter.yaml: a login
# wall (401/403) counts as up; 5xx and no answer do not.
# To add a target: copy a block, change name / app / url. 30s = the Prometheus
# scrape interval.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: argocd-in-cluster
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelab-uptime
spec:
  jobName: blackbox-http
  interval: 30s
  scrapeTimeout: 15s
  module: http_up
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://argocd-server.argocd.svc.cluster.local/healthz
      labels:
        app: argocd
        group: Platform
        layer: in-cluster
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: argocd-front-door
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelab-uptime
spec:
  jobName: blackbox-http
  interval: 30s
  scrapeTimeout: 15s
  module: http_up
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://argocd.192.168.1.153.nip.io/healthz
      labels:
        app: argocd
        group: Platform
        layer: front-door
