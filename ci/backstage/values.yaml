# Backstage, the developer portal, with a catalog read from THIS repository.
#
# What Backstage is for, in one line: developers on other teams should be able
# to answer "who owns this, where is its pipeline, how do I build a new one"
# without asking the platform team. The catalog answers the first two; the
# scaffolder (software templates) answers the third.
#
# This runs the upstream DEMO image. A real deployment builds its own image,
# because Backstage plugins are compiled in -- you cannot install a plugin into
# a running Backstage the way you install one into Jenkins. That difference is
# the most important thing to know about operating it.
backstage:
  # Load the IMAGE'S app-config.yaml first, then ours on top.
  #
  # The chart's default is `--config /app/app-config-from-configmap.yaml` and
  # nothing else, which silently drops the config the image was built with --
  # including the new frontend system's extension setup. The page loads, then
  # dies one missing value at a time:
  #   Missing required config value at 'app.title' in 'app'
  #   Error in extension 'nav-content:app'; caused by NotImplementedError:
  #     No implementation available for apiRef{plugin.notifications.service}
  # NOT app-config.production.yaml: it points at PostgreSQL via ${POSTGRES_*},
  # which this lab does not run.
  # (The chart appends --config for the configmap itself.)
  args:
    - --config
    - app-config.yaml
  image:
    registry: ghcr.io
    repository: backstage/backstage
    # Pinned. The chart's default is :latest.
    tag: "1.55.2"
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  appConfig:
    # Both baseUrls are OVERRIDDEN at install time with the node address by
    # scripts/backstage-install.sh. The browser is told to call the backend at
    # backend.baseUrl -- leave it at localhost and the page loads (the backend
    # serves the frontend) but every API call goes to the viewer's own laptop.
    app:
      # REQUIRED by the frontend. Missing, the page loads and then dies with
      #   Missing required config value at 'app.title' in 'app'
      title: Platform Lab
      baseUrl: http://localhost:7007
      # Notifications OFF, because this lab serves plain http on an IP.
      #
      # The notifications nav item subscribes to live updates (signals), which
      # calls crypto.randomUUID() -- and browsers only provide that on a SECURE
      # origin (https or localhost). On http://<node-ip> the whole sidebar dies:
      #   Error in extension 'nav-content:app'; caused by TypeError:
      #     globalThis.crypto.randomUUID is not a function
      # Behind TLS, delete the three `false` lines below.
      #
      # This only papers over the sidebar. SEARCH breaks the same way
      #   Error in search ... globalThis.crypto.randomUUID is not a function
      # and so may other plugins. Over plain http Backstage is only partly
      # usable. The real fix is TLS (an ingress with a certificate, or Cloud
      # Run, which serves https by default). For a quick look in Chrome only:
      # chrome://flags/#unsafely-treat-insecure-origin-as-secure.
      #
      # This list REPLACES the image's app.extensions (Backstage replaces arrays
      # rather than merging them), so the one entry from it that matters --
      # catalog mounted at / -- is repeated here.
      extensions:
        - page:catalog:
            config:
              path: /
        - page:notifications: false
        - home-page-widget:notifications/unread-notifications: false
        # The image's custom sidebar hardcodes a notifications link, so with
        # the page off it fails instead:
        #   No path for routeRef{id=notifications.root,legacyId=notifications}
        # Off too; Backstage's default sidebar lists only the pages that exist.
        - nav-content:app: false
    organization:
      name: Platform Lab
    backend:
      baseUrl: http://localhost:7007
      cors:
        origin: http://localhost:7007
      # REQUIRED when serving over plain http. Backstage's default CSP ends in
      # `upgrade-insecure-requests`, so the browser rewrites every script URL to
      # https://, which this NodePort does not serve. Result: HTTP 200, a blank
      # white page, and no server-side error anywhere. curl sees nothing wrong
      # because curl ignores CSP -- only the browser console shows it.
      # Behind TLS (any real deployment), leave the default on.
      csp:
        upgrade-insecure-requests: false
      # In-memory SQLite: the catalog rebuilds from git on every start, which
      # is fine because git IS the source of truth for the catalog. Production
      # uses PostgreSQL so search indexes and scaffolder history survive.
      database:
        client: better-sqlite3
        connection: ':memory:'
    # Guest sign-in. Backstage refuses the guest provider outside development
    # unless told otherwise; a lab with no identity provider has no other way
    # in. Production wires GitHub/OIDC sign-in here instead.
    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User, Template]
      locations:
        - type: url
          target: https://github.com/alecuvalentin22/aws-kodekloud-playground/blob/main/catalog-info.yaml

service:
  type: NodePort
  nodePorts:
    backend: 30096

postgresql:
  enabled: false
