---
- name: Add Elastic GPG key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /usr/share/keyrings/elastic.asc
    mode: "0644"

- name: Add Elastic 8.x apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elastic.asc] https://artifacts.elastic.co/packages/8.x/apt stable main"
    filename: elastic-8.x
    state: present

- name: Install Elasticsearch
  ansible.builtin.apt:
    name: "elasticsearch={{ elastic_version }}"
    state: present
    update_cache: true
  notify: restart elasticsearch

- name: Hold the Elasticsearch package at the pinned version
  ansible.builtin.dpkg_selections:
    name: elasticsearch
    selection: hold

- name: Create data and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: "0750"
  loop:
    - "{{ elastic_data_path }}"
    - "{{ elastic_log_path }}"

- name: Template elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

- name: Set JVM heap
  ansible.builtin.template:
    src: jvm-heap.options.j2
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

- name: Ensure the systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Raise systemd file and memlock limits
  ansible.builtin.copy:
    dest: /etc/systemd/system/elasticsearch.service.d/override.conf
    content: |
      [Service]
      LimitMEMLOCK=infinity
      LimitNOFILE=65535
    owner: root
    group: root
    mode: "0644"
  notify: restart elasticsearch

- name: Register the S3 snapshot credentials in the keystore
  ansible.builtin.shell: |
    set -o pipefail
    if ! /usr/share/elasticsearch/bin/elasticsearch-keystore list | grep -q '^s3.client.default.access_key$'; then
      echo -n '{{ minio_root_user }}' | /usr/share/elasticsearch/bin/elasticsearch-keystore add -x -f s3.client.default.access_key
      echo -n '{{ minio_root_password }}' | /usr/share/elasticsearch/bin/elasticsearch-keystore add -x -f s3.client.default.secret_key
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: es_keystore
  changed_when: "'CHANGED' in es_keystore.stdout"
  when:
    - groups['minio'] | length > 0
    - minio_enabled | default(true) | bool
  notify: restart elasticsearch

- name: Flush handlers before waiting for the cluster
  ansible.builtin.meta: flush_handlers

- name: Enable and start Elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the HTTP port to answer
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname]['ansible_' + private_iface]['ipv4']['address'] | default(ansible_default_ipv4.address) }}"
    port: "{{ elastic_http_port }}"
    timeout: 180
