---
# RKE2 runs its control plane as STATIC PODS, not systemd units. When the API
# server will not come up, `crictl ps` is where you look -- not `systemctl`.
- name: Create the RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Write RKE2 config
  ansible.builtin.copy:
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
    content: |
      # Managed by Ansible
      write-kubeconfig-mode: "0644"
      tls-san:
        - {{ ansible_host }}
      # rke2-ingress-nginx is DELIBERATELY LEFT ENABLED when this node runs
      # Rancher, and that is not a style preference -- it is load-bearing.
      #
      # Disabling it forces you to reach Rancher some other way, and the
      # obvious workaround (a NodePort straight to the pod's TLS port 444)
      # silently breaks cluster import:
      #
      #   cattle-cluster-agent: Could not securely connect to
      #   https://<ip>:30443: x509: certificate signed by unknown authority
      #
      # Port 444 is served by Rancher's INTERNAL dynamiclistener, whose CA is
      # regenerated in memory and is NOT the CA that Rancher publishes in its
      # `cacerts` setting. Verified: the served cert was issued by
      # dynamiclistener-ca@...045 while cacerts advertised ...041, and the
      # signing CA existed in no secret on the cluster. Agents pin on cacerts,
      # so they can never validate that connection.
      #
      # Reached through its Ingress, Rancher serves the cert-manager
      # certificate that cacerts actually describes, and agents connect.
      #
      # Kong is the gateway on the k3s node; this node runs Rancher, and
      # Rancher needs an ingress controller.
      disable: "{{ ['rke2-ingress-nginx'] if not rancher_enabled | bool else [] }}"
  notify: restart rke2-server

- name: Install RKE2
  ansible.builtin.shell: |
    set -o pipefail
    if ! systemctl list-unit-files | grep -q '^rke2-server'; then
      curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION={{ rke2_version }} sh -
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: rke2_install
  changed_when: "'CHANGED' in rke2_install.stdout"

- name: Enable and start rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the RKE2 kubeconfig to appear
  ansible.builtin.wait_for:
    path: /etc/rancher/rke2/rke2.yaml
    timeout: 300

- name: Link the bundled kubectl and crictl onto PATH
  ansible.builtin.file:
    src: "/var/lib/rancher/rke2/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - kubectl
    - crictl

- name: Record RKE2 paths
  ansible.builtin.set_fact:
    kubeconfig_path: /etc/rancher/rke2/rke2.yaml
    kubectl_bin: /usr/local/bin/kubectl
