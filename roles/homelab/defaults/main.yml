---
# Who runs Incus. Same resolution as roles/playground.
homelab_user: "{{ ansible_user | default(ansible_env.SUDO_USER) | default(ansible_user_id) }}"

# --- KVM -----------------------------------------------------------------------
# VMs need /dev/kvm. Inside WSL2 that is nested virtualization (Windows 11,
# `nestedVirtualization`, default true). If it is absent the role FAILS with
# the fallback, rather than installing a hypervisor that cannot run a VM.
homelab_require_kvm: true

# --- Incus, from Zabbly's 6.0 LTS repository -------------------------------------
# Why Zabbly and not Ubuntu's archive: noble ships incus 6.0.0-1ubuntu0.3;
# Zabbly's lts-6.0 is the same LTS line with six point releases of fixes, and
# bundles the QEMU that VMs need. Pinned to the RELEASE and held: Zabbly's
# version strings end in a per-architecture build stamp (amd64 ...272003,
# arm64 ...272249 for the same 6.0.6), so the stamp is a wildcard.
homelab_incus_version: "1:6.0.6-ubuntu24.04-*"
homelab_zabbly_fingerprint: 4EFC590696CB15B87C73A3AD82CC8797C838DCFD

# Listen on every address, port 8443. Clients still need a trusted TLS
# certificate (token flow below) -- an open port is not an open API.
homelab_incus_https_address: ":8443"
# Storage: `dir` is the one driver that needs nothing else inside WSL (no ZFS
# module, no loop devices). Slower clones than zfs/btrfs; fine for a lab.
homelab_incus_pool_driver: dir
# The VM network. A fixed /24 so VM addresses are predictable and the
# generated Ansible inventory never changes between rebuilds.
homelab_incus_bridge: incusbr0
homelab_incus_subnet: 10.77.0.1/24

# Issue a one-time trust token for this client name (printed at the end).
homelab_incus_trust_client: ""        # e.g. "mac"

# --- VMs for Kubernetes ----------------------------------------------------------
# Used by playbooks/homelab-vms.yml. Static DHCP reservations on the bridge.
# ONE multi-node RKE2 cluster: a server and two agents that JOIN it
# (playbooks/rke2-cluster.yml, roles/rke2_cluster). `role` decides the group in
# the generated inventory; `distribution` is kept so playbooks/k8s.yml still
# works against any single host. 12 vCPU / 36 GiB of the box's 16 / 47.
# The /cloud variant: plain images:ubuntu/24.04 has NO cloud-init, so the user,
# key and packages in cloud-init.yaml.j2 are silently ignored and the VM is
# unreachable (seen on homelab-1: `cloud-init: command not found`).
homelab_vm_image: images:ubuntu/24.04/cloud
homelab_vm_user: lab
homelab_vm_ssh_keys: []                # public keys allowed into the VMs
homelab_vms:
  - {name: rke2-s1, ip: 10.77.0.31, cpus: 4, memory: 12GiB, disk: 60GiB, distribution: rke2, role: server}
  - {name: rke2-a1, ip: 10.77.0.32, cpus: 4, memory: 12GiB, disk: 60GiB, distribution: rke2, role: agent}
  - {name: rke2-a2, ip: 10.77.0.33, cpus: 4, memory: 12GiB, disk: 60GiB, distribution: rke2, role: agent}

# Where the generated inventory lands ON THE CONTROLLER (the Mac).
homelab_inventory_out: "{{ playbook_dir }}/../homelab/generated/k8s.ini"
# How the controller reaches the VMs: through the Windows SSH server, then
# the WSL sshd, then the VM. Hosts are as named in the controller's ~/.ssh/config.
# homelab-N-wsl (written by homelab/mac/add-host.sh) already jumps through
# homelab-N and carries the PINNED WSL host key; going via it means only the
# VMs' own keys are learned on first use, over an already-verified tunnel.
homelab_ssh_alias: homelab-1
homelab_proxy_jump: "{{ homelab_ssh_alias }}-wsl"

# Link inventory/group_vars (and its vault) into homelab/generated/ -- only
# needed for playbooks/k8s.yml's single-node path. See tasks/vms.yml.
homelab_link_group_vars: false

# The controller's private key for the VMs (its .pub is in homelab_vm_ssh_keys).
homelab_vm_private_key: ~/.ssh/homelab_ed25519

# --- LAN ingress: an L4 forwarder in front of the RKE2 nodes' ingress-nginx ------
# Off by default: it makes the lab answer on the LAN. homelab/mac/lan-ingress.sh
# turns it on (and opens the Windows firewall for the same ports, scoped to the
# LAN subnet -- see homelab/windows/lan-ingress.ps1).
homelab_lan_ingress: false
# HAProxy from Ubuntu's own archive (noble), pinned to the exact build and held.
# Why HAProxy and not nginx stream: it has real active health checks on every
# backend (nginx stream's are passive only unless you buy Plus), and a stats
# socket that shows each server UP/DOWN.
homelab_lan_ingress_haproxy_version: "2.8.16-0ubuntu0.24.04.3"
# What the forwarder listens on (0.0.0.0, shared with Windows in mirrored mode).
homelab_lan_ingress_http_port: 80
homelab_lan_ingress_https_port: 443
# RKE2's ingress-nginx DaemonSet publishes these hostPorts on every node.
homelab_lan_ingress_backend_http_port: 80
homelab_lan_ingress_backend_https_port: 443
# Nodes = homelab_vms (all of them: server and agents all run the DaemonSet).
# Active TCP-connect check: a node whose ingress pod is drained/gone refuses
# the connection and is skipped after `fall` failed checks.
homelab_lan_ingress_check_inter: 2s
homelab_lan_ingress_check_fall: 3
homelab_lan_ingress_check_rise: 2
# Read-only stats page, loopback only (never reachable from the LAN).
homelab_lan_ingress_stats_port: 8404

# Extra TCP passthrough forwards, one HAProxy frontend+backend each. Keep the port
# list in step with -Ports in homelab/windows/lan-ingress.ps1 (the firewall side).
#   port          what the LAN connects to
#   bind          address HAProxy listens on (default 0.0.0.0)
#   backends      list of IPs; each is health-checked, dead ones are skipped
#   backend_port  port on the backends
# The RKE2 API authenticates with client certs, so passthrough is enough. Its
# backends are every homelab_vms entry with role: server, so an HA control plane
# (more servers) joins the pool by itself. 9345 (join), 2379/2380 (etcd), 10250
# (kubelet) are deliberately not forwarded.
homelab_lan_ingress_lan_address: "{{ ansible_default_ipv4.address }}"
homelab_lan_tcp_forwards:
  - name: rke2_api
    port: 6443
    backends: "{{ homelab_vms | selectattr('role', 'equalto', 'server') | map(attribute='ip') | list }}"
    backend_port: 6443
  # The drill game (kind in WSL) publishes these NodePorts on 127.0.0.1 only, and
  # on Linux a wildcard bind clashes with that. So HAProxy binds the WSL's LAN
  # address (mirrored mode: the PC's own) and relays to loopback: kind.yaml, and
  # the Mac's copy of it, stay as they are and the cluster is not recreated.
  - {name: jenkins,  port: 30094, bind: "{{ homelab_lan_ingress_lan_address }}", backends: [127.0.0.1], backend_port: 30094}
  - {name: demo_api, port: 30095, bind: "{{ homelab_lan_ingress_lan_address }}", backends: [127.0.0.1], backend_port: 30095}
  - {name: gitea,    port: 30300, bind: "{{ homelab_lan_ingress_lan_address }}", backends: [127.0.0.1], backend_port: 30300}

# Extra SANs for the RKE2 API certificate, written into the generated inventory
# (homelab/generated/k8s.ini) so every rke2-cluster.yml run keeps them. Set per
# PC in homelab/inventory.ini, e.g. homelab_rke2_extra_sans='["192.168.0.23"]'.
homelab_rke2_extra_sans: []

# Off-VM copies of the RKE2 etcd snapshots (tasks/backups.yml).
homelab_backups: true
homelab_backup_server_vm: rke2-s1
homelab_backup_dir: "/home/{{ homelab_user }}/backups/etcd"
# On the Windows disk (C:\homelab-backups\etcd), so a lost WSL disk keeps them.
homelab_backup_windows_dir: /mnt/c/homelab-backups/etcd
homelab_backup_keep: 24

# --- Power management (tasks/power.yml, --tags power) ---------------------------
# `homelab-power sleep|wake|status|idle-check` in WSL. Asleep = the static
# Jenkins agent, the kind playground containers and the Incus VMs (the RKE2
# cluster) are stopped; WSL, sshd, Docker, Incus and HAProxy stay up.
homelab_power: true
# systemd OnCalendar times; the zone suffix needs systemd >= 235 (Ubuntu 24.04 has 255).
# "" switches that timer off.
homelab_power_timezone: Europe/Bucharest
homelab_power_sleep_at: "01:00:00"
homelab_power_wake_at: "07:30:00"
# Idle sleep: this many hours of continuous idle (no SSH session into WSL, no new
# session through HAProxy), checked every 15 minutes. 0 = disabled.
homelab_power_idle_hours: 3
# Idle sleep only fires from this hour (inclusive) to that hour (exclusive),
# wrapping midnight: 8 -> 1 means 08:00-01:00. The night is the schedule's job.
homelab_power_idle_from: 8
homelab_power_idle_until: 1
# ...and never within this many hours after a wake.
homelab_power_idle_grace_hours: 2
# Graceful `incus stop` timeout per VM before --force, and the bound on `wake`.
homelab_power_stop_timeout: 120
homelab_power_wake_timeout: 600
# Containers outside the kind label that sleep also stops (and wake restarts),
# and the optional static Jenkins agent (playground/setup/static-agent.sh).
homelab_power_extra_containers: [kind-registry]
homelab_power_static_container: pg-static-01
