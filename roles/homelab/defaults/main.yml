---
# Who runs Incus. Same resolution as roles/playground.
homelab_user: "{{ ansible_user | default(ansible_env.SUDO_USER) | default(ansible_user_id) }}"

# --- KVM -----------------------------------------------------------------------
# VMs need /dev/kvm. Inside WSL2 that is nested virtualization (Windows 11,
# `nestedVirtualization`, default true). If it is absent the role FAILS with
# the fallback, rather than installing a hypervisor that cannot run a VM.
homelab_require_kvm: true

# --- Incus, from Zabbly's 6.0 LTS repository -------------------------------------
# Why Zabbly and not Ubuntu's archive: noble ships incus 6.0.0-1ubuntu0.3;
# Zabbly's lts-6.0 is the same LTS line with six point releases of fixes, and
# bundles the QEMU that VMs need. Pinned to the RELEASE and held: Zabbly's
# version strings end in a per-architecture build stamp (amd64 ...272003,
# arm64 ...272249 for the same 6.0.6), so the stamp is a wildcard.
homelab_incus_version: "1:6.0.6-ubuntu24.04-*"
homelab_zabbly_fingerprint: 4EFC590696CB15B87C73A3AD82CC8797C838DCFD

# Listen on every address, port 8443. Clients still need a trusted TLS
# certificate (token flow below) -- an open port is not an open API.
homelab_incus_https_address: ":8443"
# Storage: `dir` is the one driver that needs nothing else inside WSL (no ZFS
# module, no loop devices). Slower clones than zfs/btrfs; fine for a lab.
homelab_incus_pool_driver: dir
# The VM network. A fixed /24 so VM addresses are predictable and the
# generated Ansible inventory never changes between rebuilds.
homelab_incus_bridge: incusbr0
homelab_incus_subnet: 10.77.0.1/24

# Issue a one-time trust token for this client name (printed at the end).
homelab_incus_trust_client: ""        # e.g. "mac"

# --- VMs for Kubernetes ----------------------------------------------------------
# Used by playbooks/homelab-vms.yml. Static DHCP reservations on the bridge.
# ONE multi-node RKE2 cluster: a server and two agents that JOIN it
# (playbooks/rke2-cluster.yml, roles/rke2_cluster). `role` decides the group in
# the generated inventory; `distribution` is kept so playbooks/k8s.yml still
# works against any single host. 12 vCPU / 36 GiB of the box's 16 / 47.
# The /cloud variant: plain images:ubuntu/24.04 has NO cloud-init, so the user,
# key and packages in cloud-init.yaml.j2 are silently ignored and the VM is
# unreachable (seen on homelab-1: `cloud-init: command not found`).
homelab_vm_image: images:ubuntu/24.04/cloud
homelab_vm_user: lab
homelab_vm_ssh_keys: []                # public keys allowed into the VMs
homelab_vms:
  - {name: rke2-s1, ip: 10.77.0.31, cpus: 4, memory: 12GiB, disk: 60GiB, distribution: rke2, role: server}
  - {name: rke2-a1, ip: 10.77.0.32, cpus: 4, memory: 12GiB, disk: 60GiB, distribution: rke2, role: agent}
  - {name: rke2-a2, ip: 10.77.0.33, cpus: 4, memory: 12GiB, disk: 60GiB, distribution: rke2, role: agent}

# Where the generated inventory lands ON THE CONTROLLER (the Mac).
homelab_inventory_out: "{{ playbook_dir }}/../homelab/generated/k8s.ini"
# How the controller reaches the VMs: through the Windows SSH server, then
# the WSL sshd, then the VM. Hosts are as named in the controller's ~/.ssh/config.
# homelab-N-wsl (written by homelab/mac/add-host.sh) already jumps through
# homelab-N and carries the PINNED WSL host key; going via it means only the
# VMs' own keys are learned on first use, over an already-verified tunnel.
homelab_ssh_alias: homelab-1
homelab_proxy_jump: "{{ homelab_ssh_alias }}-wsl"

# Link inventory/group_vars (and its vault) into homelab/generated/ -- only
# needed for playbooks/k8s.yml's single-node path. See tasks/vms.yml.
homelab_link_group_vars: false

# The controller's private key for the VMs (its .pub is in homelab_vm_ssh_keys).
homelab_vm_private_key: ~/.ssh/homelab_ed25519
