---
# One multi-node RKE2 cluster: hosts in [rke2_servers] form the control plane,
# hosts in [rke2_agents] join it. roles/kubernetes, by contrast, builds a
# single-node cluster per host.

# Same pin as roles/kubernetes (and one minor from the EKS lab's 1.33).
rke2_cluster_version: "v1.33.13+rke2r1"

# The join secret. Generated ONCE on the controller (the Mac), kept in the
# git-ignored homelab/generated/, and handed to every node: an agent that has
# it can join, so it is a credential -- never commit it.
rke2_cluster_token_file: "{{ playbook_dir }}/../homelab/generated/rke2-token"

# The kubeconfig fetched to the controller, mode 600. Its server is
# https://127.0.0.1:6443, reached through homelab/mac/kube-tunnel.sh.
rke2_cluster_kubeconfig_out: "{{ playbook_dir }}/../homelab/generated/rke2.kubeconfig"
rke2_cluster_context: homelab-rke2

# The first server; agents register against it on the supervisor port.
rke2_cluster_server_ip: "{{ hostvars[groups['rke2_servers'][0]].ansible_host }}"
rke2_cluster_supervisor_port: 9345

# Registries containerd may pull from over plain http. Written to
# /etc/rancher/rke2/registries.yaml on EVERY node (server and agents): image
# pulls are done by each node's own containerd, which cannot resolve cluster DNS
# and refuses http by default. The default is the in-cluster registry
# (homelab/platform/manifests/registry: NodePort 30500, reachable on any node
# IP). An empty list removes the file. Changing it needs an RKE2 restart; for a
# live cluster use playbooks/rke2-registries.yml, which does it one node at a
# time, agents first.
rke2_cluster_registry_mirrors:
  - host: "{{ rke2_cluster_server_ip }}:30500"
    endpoint: "http://{{ rke2_cluster_server_ip }}:30500"

# Extra names/IPv4 addresses for the API server's serving certificate, appended
# to tls-san in /etc/rancher/rke2/config.yaml on the servers. EMPTY by default,
# which renders the file exactly as before (no change, no restart). Set it to
# let a client reach the API by another address, e.g. the PC's LAN address:
# homelab/mac/lan-kube-api.sh runs playbooks/rke2-sans.yml with
# -e '{"rke2_cluster_extra_sans": ["192.168.1.153"]}'.
# NB: rke2-cluster.yml renders config.yaml too, so re-running it WITHOUT the
# variable drops the SAN again (and restarts rke2-server); keep it in -e or in
# your own group_vars if the SAN should stay.
rke2_cluster_extra_sans: []

# Only for rke2-sans.yml: SANs that must NOT be on the served certificate. The
# step regenerates the cert if one of them is still there (RKE2 only ever adds
# SANs to its stored cert; removing one needs the stored cert deleted).
rke2_cluster_sans_absent: []

# etcd snapshots on the server (in /var/lib/rancher/rke2/server/db/snapshots).
# Every 6 h, keep 12 (= 3 days). They are a few MB each. A snapshot on the VM's
# own disk dies with the VM, so roles/homelab copies them off it.
rke2_cluster_etcd_snapshot_cron: "0 */6 * * *"
rke2_cluster_etcd_snapshot_retention: 12
