# The Backstage catalog for this repository -- the ROOT location.
#
# Backstage is pointed at this one file (ci/backstage/values.yaml). It does not
# describe anything itself; it lists the files that do. That is the pattern
# real platforms use: one small entry point, entities split by kind, and every
# file reviewed in a pull request next to the code it describes.
#
# How to read the catalog, in order:
#   catalog/org.yaml        who owns things (Groups)
#   catalog/systems.yaml    the big picture (Domains, Systems)
#   catalog/components.yaml what runs (services, libraries, tools)
#   catalog/apis.yaml       contracts between them (OpenAPI)
#   catalog/resources.yaml  infrastructure they depend on
#   templates/              the golden path: "create a new service"
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform-lab
  description: Entry point for every catalog file in this repository
spec:
  targets:
    - ./catalog/org.yaml
    - ./catalog/systems.yaml
    - ./catalog/components.yaml
    - ./catalog/apis.yaml
    - ./catalog/resources.yaml
    - ./templates/new-service/template.yaml
