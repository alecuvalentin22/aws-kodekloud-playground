[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# The community.general.yaml callback was REMOVED in community.general 12
# (shipped with ansible 14). Same readable output, now built in:
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

# apt must never be able to open an interactive prompt: on a headless box a
# prompt is an infinite hang, not an error. See roles/common/tasks/main.yml.
[defaults_env]

[ssh_connection]
pipelining = True
