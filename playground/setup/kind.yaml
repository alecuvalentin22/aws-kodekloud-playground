# One node: the Docker VM this was sized for has 4 CPUs / 4 GB, and a second
# node would spend most of that on a second kubelet. Multi-node scheduling
# drills belong to the EKS tier.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: playground
containerdConfigPatches:
  # Lets each registry be configured by a hosts.toml under certs.d -- how the
  # node is told that kind-registry:5000 speaks plain HTTP.
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # NodePorts published on localhost only. Same numbers as the EKS lab.
    extraPortMappings:
      - {containerPort: 30094, hostPort: 30094, listenAddress: 127.0.0.1}  # Jenkins
      - {containerPort: 30095, hostPort: 30095, listenAddress: 127.0.0.1}  # demo-api
      - {containerPort: 30300, hostPort: 30300, listenAddress: 127.0.0.1}  # Gitea
