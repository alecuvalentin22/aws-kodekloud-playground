# Defaults = the chart's public interface. Every key here is also listed in
# values.schema.json, so a typo in an override file or --set fails before
# anything reaches the cluster. Per-environment differences live in
# values-<env>.yaml.

# Names. Empty = derived from the chart name and the release name (_helpers.tpl).
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  # kind-registry:5000 is how the CLUSTER reaches the playground registry
  # (from your laptop it is localhost:5001).
  repository: kind-registry:5000/helm-lab/notes-api
  # REQUIRED by the schema, never "latest": a moving tag makes two deploys of
  # the same chart different. It is NOT defaulted to appVersion (helm create's
  # scaffold does that) on purpose: the image is a deploy decision.
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Non-secret settings -> a ConfigMap -> environment variables (envFrom). A change
# here rolls the pods (checksum/config in the Deployment). Secrets do NOT belong
# in values: they end up in the release record and in git.
config:
  MAX_NOTE_LENGTH: "280"
  READ_ONLY: "false"
  LOG_LEVEL: info

service:
  type: ClusterIP
  port: 80

# The container listens here. Named "http" so probes and the Service refer to
# the name, not the number.
containerPort: 8080

# maxUnavailable 0: a bad new pod stalls the rollout instead of removing a good
# one, which is what lets --atomic roll back with no outage.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

livenessProbe:
  httpGet: {path: /healthz, port: http}
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 5
  failureThreshold: 3

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

# `helm test` pod (templates/tests/test-connection.yaml)
test:
  timeoutSeconds: 5
