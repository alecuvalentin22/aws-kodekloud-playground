# Shared by every service repo of the platform. Callers should pin a release
# tag (`@v1.0.0`) or a commit SHA, never `@main`.
#
# TODO(pin): the actions below are version tags; see setup/up-github.sh --pin-actions.
name: python-lint

on:
  workflow_call:
    inputs:
      path:
        description: Directory to lint
        type: string
        required: false
        default: "."
      python-version:
        description: Python version to lint with
        type: string
        required: false
        default: "3.13"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: flake8
        env:
          LINT_PATH: ${{ inputs.path }}
        run: |
          python -m pip install --quiet flake8==7.1.1
          python -m flake8 --max-line-length 100 "$LINT_PATH"
