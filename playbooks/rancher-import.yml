---
# Import the k3s cluster into the Rancher running on RKE2.
#
#   ansible-playbook playbooks/rancher-import.yml --ask-vault-pass
#
# Prerequisite: both clusters exist and Rancher is Ready on rke2-01.
#   ansible-playbook playbooks/k8s.yml --limit k3s-01  -e rancher_enabled=false
#   ansible-playbook playbooks/k8s.yml --limit rke2-01 -e kong_enabled=false -e kong_oidc_enabled=false
#
# Result: one Rancher control plane managing two clusters running two different
# Kubernetes distributions. Everything in drills/07 becomes demonstrable --
# projects, project-scoped RBAC, and Helm deploys to a cluster whose kubeconfig
# you never touch.

- name: Import the downstream cluster into Rancher
  hosts: k8s
  become: true
  gather_facts: true
  tasks:
    # include_ROLE with tasks_from, NOT include_tasks.
    #
    # include_tasks on a file that happens to live inside a role loads the
    # TASKS and nothing else -- no defaults/, no vars/. Every variable the file
    # relies on is then undefined:
    #
    #   Error while resolving value for 'rancher_api':
    #   'rancher_node_port' is undefined
    #
    # include_role runs the role machinery, so roles/kubernetes/defaults is
    # loaded first and rancher_node_port / rancher_import_name resolve.
    - name: Run the import from the Rancher host only
      ansible.builtin.include_role:
        name: kubernetes
        tasks_from: rancher-import.yml
      when: k8s_distribution == 'rke2'
