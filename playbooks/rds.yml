---
# Configure the managed PostgreSQL instance: application role, database, grants,
# a connectivity test and a restore test.
#
# HOW TO RUN IT -- the master password is generated by Terraform and never
# written to disk, so pipe it straight out of state:
#
#   ansible-playbook playbooks/rds.yml \
#     -e rds_master_password="$(terraform -chdir=terraform/aws output -raw rds_password)"
#
# NOTE THE hosts: LINE. It is es-01, not the database.
# RDS has no sshd, so there is no host for Ansible to connect to, and the
# endpoint is not publicly reachable so the laptop cannot see it either. es-01
# is inside the VPC and inside the lab security group -- which is exactly what
# the RDS security group's ingress rule allows -- so the play runs there and
# points every module at the endpoint with login_host.
#
# That is the general pattern for managed services: you do not configure the
# host, you configure THROUGH a host that is allowed to talk to it.

- name: Configure managed PostgreSQL (RDS)
  hosts: elastic[0]
  become: true
  gather_facts: false

  vars:
    # A YAML merge anchor: every task below pulls these four keys in with
    # `<<: *pg_conn` instead of repeating them. Note login_db rather than db --
    # community.postgresql 4.x (ansible 14) REMOVED the `db` alias, and the
    # error names every supported parameter except the one you used.
    pg_conn: &pg_conn
      login_host: "{{ rds_endpoint }}"
      login_port: "{{ rds_port | default(5432) }}"
      login_user: "{{ rds_master_username }}"
      login_password: "{{ rds_master_password }}"

  pre_tasks:
    - name: Require the endpoint and the master password
      ansible.builtin.assert:
        that:
          - rds_endpoint is defined and rds_endpoint | length > 0
          - rds_master_password is defined and rds_master_password | length > 0
        fail_msg: >-
          Missing rds_endpoint (regenerate the inventory with `terraform apply`)
          or rds_master_password. Pass the password with:
          -e rds_master_password="$(terraform -chdir=terraform/aws output -raw rds_password)"

    - name: Ensure the PostgreSQL client library is present on the jump host
      ansible.builtin.apt:
        name:
          - python3-psycopg2
          - postgresql-client
        state: present
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Wait for the RDS endpoint to accept connections
      ansible.builtin.wait_for:
        host: "{{ rds_endpoint }}"
        port: "{{ rds_port | default(5432) }}"
        timeout: 600
      # RDS reports "available" before it is actually listening; and after a
      # parameter-group change it bounces. Waiting is not optional.

    - name: Show what we are connected to
      community.postgresql.postgresql_info:
        <<: *pg_conn
        login_db: postgres
        filter: ver*,set*
      register: rds_info

    - name: Report server version and superuser status
      ansible.builtin.debug:
        msg: >-
          RDS PostgreSQL {{ rds_info.version.full }} at {{ rds_endpoint }}.
          The master user is rds_superuser, NOT a real superuser -- no filesystem
          access, no untrusted languages, and only AWS-approved extensions.

    # ---------------------------------------------------------------------
    # Roles and grants. Identical module calls to the EC2 PostgreSQL role --
    # the SQL layer is genuinely the same. Only the connection differs.
    # ---------------------------------------------------------------------
    - name: Create the application role
      community.postgresql.postgresql_user:
        <<: *pg_conn
        login_db: "{{ postgres_app_db }}"
        name: "{{ postgres_app_user }}"
        password: "{{ postgres_app_password }}"
        state: present

    - name: Ensure the application database exists
      community.postgresql.postgresql_db:
        <<: *pg_conn
        maintenance_db: postgres
        name: "{{ postgres_app_db }}"
        owner: "{{ postgres_app_user }}"
        state: present

    # LEAST PRIVILEGE. The app role gets CONNECT and table rights, not
    # ownership of the schema and not CREATEDB/CREATEROLE. Revoking the
    # PUBLIC role's CREATE on the schema is the step everyone forgets: without
    # it, every user on the database can create objects in `public`.
    - name: Revoke CREATE on the public schema from PUBLIC
      community.postgresql.postgresql_privs:
        <<: *pg_conn
        login_db: "{{ postgres_app_db }}"
        type: schema
        objs: public
        roles: PUBLIC
        privs: CREATE
        state: absent

    - name: Grant the application role usage of the public schema
      community.postgresql.postgresql_privs:
        <<: *pg_conn
        login_db: "{{ postgres_app_db }}"
        type: schema
        objs: public
        roles: "{{ postgres_app_user }}"
        privs: USAGE,CREATE
        state: present

    # ---------------------------------------------------------------------
    # Prove it works, from the application's point of view rather than the
    # admin's -- connect AS the app user, write, read back.
    # ---------------------------------------------------------------------
    - name: Create a table as the application user
      community.postgresql.postgresql_query:
        login_host: "{{ rds_endpoint }}"
        login_port: "{{ rds_port | default(5432) }}"
        login_user: "{{ postgres_app_user }}"
        login_password: "{{ postgres_app_password }}"
        login_db: "{{ postgres_app_db }}"
        query: |
          CREATE TABLE IF NOT EXISTS lab_check (
            id     serial PRIMARY KEY,
            note   text NOT NULL,
            seen_at timestamptz NOT NULL DEFAULT now()
          );

    - name: Insert a row
      community.postgresql.postgresql_query:
        login_host: "{{ rds_endpoint }}"
        login_port: "{{ rds_port | default(5432) }}"
        login_user: "{{ postgres_app_user }}"
        login_password: "{{ postgres_app_password }}"
        login_db: "{{ postgres_app_db }}"
        query: "INSERT INTO lab_check (note) VALUES (%s)"
        positional_args:
          - "written by ansible from {{ inventory_hostname }}"

    - name: Read it back
      community.postgresql.postgresql_query:
        login_host: "{{ rds_endpoint }}"
        login_port: "{{ rds_port | default(5432) }}"
        login_user: "{{ postgres_app_user }}"
        login_password: "{{ postgres_app_password }}"
        login_db: "{{ postgres_app_db }}"
        query: "SELECT count(*) AS rows FROM lab_check"
      register: rds_rows

    - name: Confirm application connectivity
      ansible.builtin.debug:
        msg: >-
          App user {{ postgres_app_user }} connected to {{ postgres_app_db }} on
          RDS and sees {{ rds_rows.query_result[0].rows }} row(s) in lab_check.

    # ---------------------------------------------------------------------
    # Backup and restore. On EC2 this is your own pg_dump cron; here the same
    # logical dump still works and is worth doing, because RDS's automated
    # backups are PHYSICAL snapshots -- restoring one produces a whole NEW
    # instance with a new endpoint. There is no "restore this one table"
    # button. Logical dumps are how you get granular recovery on RDS.
    # ---------------------------------------------------------------------
    - name: Take a logical dump of the RDS database
      ansible.builtin.shell: |
        set -o pipefail
        PGPASSWORD='{{ rds_master_password }}' pg_dump \
          -h '{{ rds_endpoint }}' -p '{{ rds_port | default(5432) }}' \
          -U '{{ rds_master_username }}' -d '{{ postgres_app_db }}' \
          -Fc -f /var/backups/rds-{{ postgres_app_db }}.dump
      args:
        executable: /bin/bash
      changed_when: true

    - name: Show the dump
      ansible.builtin.stat:
        path: "/var/backups/rds-{{ postgres_app_db }}.dump"
      register: rds_dump

    - name: Confirm the dump exists
      ansible.builtin.debug:
        msg: >-
          Dump is {{ (rds_dump.stat.size / 1024) | round(1) }} KiB at
          /var/backups/rds-{{ postgres_app_db }}.dump. Restore it into the EC2
          PostgreSQL with:
          pg_restore -h localhost -U {{ postgres_app_user }}
          -d {{ postgres_app_db }} --clean --if-exists
          /var/backups/rds-{{ postgres_app_db }}.dump
