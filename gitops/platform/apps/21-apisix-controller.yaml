# Wave 20. Needs a gateway to push to -- it talks to the Admin API, not etcd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apisix-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: apisix
  source:
    repoURL: https://charts.apiseven.com
    chart: apisix-ingress-controller
    targetRevision: 1.3.0
    helm:
      valuesObject:
        deployment:
          replicas: 1
          resources: {requests: {cpu: 25m, memory: 64Mi}}
        config:
          provider: {syncPeriod: 1m}
          kubernetes: {ingressClass: apisix}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
