# Wave 20. Needs a gateway to push to -- it talks to the Admin API, not etcd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apisix-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: apisix
  source:
    repoURL: https://charts.apiseven.com
    chart: apisix-ingress-controller
    targetRevision: 1.3.0
    helm:
      releaseName: apisix-ingress-controller
      valuesObject:
        # THE FIX for the shared-ownership conflict, and it turned out to exist
        # after all.
        #
        # The chart templates its IngressClass unconditionally, so a second
        # Application managing the same object always lost or won at random --
        # and when the chart won it blanked .spec.parameters and the controller
        # silently stopped being able to push config.
        #
        # createDefault makes the chart render BOTH the GatewayProxy and an
        # IngressClass already wired to it. One owner, no SharedResourceWarning,
        # and no hand-written wiring to keep in step.
        #
        # The reason this was written off earlier: the chart's default inlines
        # APISIX's published admin key (edd1c9f0...) as a literal. But the values
        # schema also has `valueFrom`, so the key can come from the Secret the
        # install script generates -- nothing sensitive in git, and the chart
        # still owns the objects. Verified by rendering the chart:
        #
        #   IngressClass  parameters -> GatewayProxy/aic-config
        #   GatewayProxy  adminKey.valueFrom.secretKeyRef -> apisix-admin/key
        gatewayProxy:
          createDefault: true
          provider:
            type: ControlPlane
            controlPlane:
              service:
                name: apisix-admin
                port: 9180
              auth:
                type: AdminKey
                adminKey:
                  # Left empty so the literal default cannot win.
                  value: ""
                  valueFrom:
                    secretKeyRef:
                      name: apisix-admin
                      key: key
        deployment:
          replicas: 1
          resources: {requests: {cpu: 25m, memory: 64Mi}}
        config:
          provider: {syncPeriod: 1m}
          kubernetes: {ingressClass: apisix}
  # TWO APPLICATIONS MUST NOT CLAIM ONE OBJECT, and this chart forces the issue.
  #
  # It ships an IngressClass with empty .spec.parameters. platform-apisix-wiring
  # (wave 30) owns the real one, with the GatewayProxy reference that makes the
  # controller work at all. With both Applications claiming it and selfHeal on,
  # they take turns reverting each other and the gateway silently stops routing
  # every time the chart's version wins.
  #
  # Same rule as Argo-CD-vs-Flux at the top of the README, one layer down: one
  # owner per object. The wiring app owns it; this app ignores it.
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ServerSideDiff, added after researching why every Application in this
      # directory sat permanently OutOfSync.
      #
      # ServerSideApply=true silently ALSO selects the "Structured-Merge Diff"
      # strategy, which the Argo CD docs mark:
      #
      #   Feature Discontinued -- challenges using this strategy to calculate
      #   diffs for CRDs that define default values
      #
      # Measured on this cluster: the etcd StatefulSet differed in 16 fields and
      # 15 were server-side DEFAULTS the chart never sets (dnsPolicy,
      # restartPolicy, schedulerName, terminationGracePeriodSeconds,
      # revisionHistoryLimit, volumeMode, ...). Exactly the described failure.
      #
      # SSA is still needed here -- kube-prometheus-stack and the APISIX CRDs
      # exceed the client-side apply annotation limit -- so the fix is to pair
      # it with the documented replacement diff strategy rather than drop it.
      - ServerSideDiff=true
      # Fail loudly instead of silently clobbering.
      #
      # Two Applications both claimed IngressClass/apisix. Argo CD's default is
      # to apply anyway -- "the last application to sync the resource wins" --
      # and it won: .spec.parameters was blanked, the APISIX controller lost its
      # GatewayProxy reference, and every status stayed green because the
      # gateway kept serving from etcd. Nothing broke visibly; only the ability
      # to apply the NEXT change was gone.
      #
      # FailOnSharedResource turns that into a failed sync. It is a
      # circuit-breaker, not a resolution -- it does not decide ownership -- but
      # given the silent version cost a working control plane, failing loudly is
      # the right default.
      - FailOnSharedResource=true
