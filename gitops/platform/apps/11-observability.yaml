# Wave 0. Must exist before anything that ships a ServiceMonitor, because the
# CRDs come from here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.2
    helm:
      releaseName: kube-prometheus-stack
      # Booleans as real booleans. Passing these through `--set-string` on the
      # command line made serviceMonitorSelectorNilUsesHelmValues the STRING
      # "false" -- truthy in a template -- so the flag did the opposite of what
      # it says and APISIX's metrics were scraped by nobody. valuesObject is
      # typed YAML and cannot make that mistake, which is one concrete reason
      # to prefer a manifest over a helm command line.
      valuesObject:
        prometheusOperator:
          admissionWebhooks: {enabled: false, patch: {enabled: false}}
          tls: {enabled: false}
          resources: {requests: {cpu: 25m, memory: 64Mi}}
        prometheus:
          service: {type: NodePort, nodePort: 30092}
          prometheusSpec:
            retention: 2h
            scrapeInterval: 30s
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests: {cpu: 100m, memory: 512Mi}
              limits: {memory: 1Gi}
        grafana:
          service: {type: NodePort, nodePort: 30091}
          persistence: {enabled: false}
          resources: {requests: {cpu: 50m, memory: 128Mi}}
        alertmanager:
          alertmanagerSpec:
            resources: {requests: {cpu: 25m, memory: 64Mi}}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ServerSideDiff, added after researching why every Application in this
      # directory sat permanently OutOfSync.
      #
      # ServerSideApply=true silently ALSO selects the "Structured-Merge Diff"
      # strategy, which the Argo CD docs mark:
      #
      #   Feature Discontinued -- challenges using this strategy to calculate
      #   diffs for CRDs that define default values
      #
      # Measured on this cluster: the etcd StatefulSet differed in 16 fields and
      # 15 were server-side DEFAULTS the chart never sets (dnsPolicy,
      # restartPolicy, schedulerName, terminationGracePeriodSeconds,
      # revisionHistoryLimit, volumeMode, ...). Exactly the described failure.
      #
      # SSA is still needed here -- kube-prometheus-stack and the APISIX CRDs
      # exceed the client-side apply annotation limit -- so the fix is to pair
      # it with the documented replacement diff strategy rather than drop it.
      - ServerSideDiff=true
      # Fail loudly instead of silently clobbering.
      #
      # Two Applications both claimed IngressClass/apisix. Argo CD's default is
      # to apply anyway -- "the last application to sync the resource wins" --
      # and it won: .spec.parameters was blanked, the APISIX controller lost its
      # GatewayProxy reference, and every status stayed green because the
      # gateway kept serving from etcd. Nothing broke visibly; only the ability
      # to apply the NEXT change was gone.
      #
      # FailOnSharedResource turns that into a failed sync. It is a
      # circuit-breaker, not a resolution -- it does not decide ownership -- but
      # given the silent version cost a working control plane, failing loudly is
      # the right default.
      - FailOnSharedResource=true
      # kube-prometheus-stack's CRDs exceed the client-side apply annotation
      # limit, same reason Argo CD's own install needs --server-side.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
