# Wave 10. Needs the StorageClass from wave -10: etcd is a StatefulSet with
# PVCs, and on the stock EKS gp2 class they never bind.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apisix
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: apisix
  source:
    repoURL: https://charts.apiseven.com
    chart: apisix
    targetRevision: 2.17.0
    helm:
      # RELEASE NAME. My first explanation of this was wrong in mechanism, and
      # the correction matters because it changes what this field is for.
      #
      # WRONG: "without this, Helm installs a second release beside the first."
      # Argo CD never runs `helm install` at all. Per the Argo CD FAQ it uses
      # Helm "only as a template mechanism" -- it runs `helm template` and
      # applies the output. It never creates, reads, or updates a Helm release
      # Secret, so there is no second release and `helm list` would never have
      # shown one.
      #
      # RIGHT: releaseName sets `.Release.Name` as a TEMPLATE VARIABLE, and this
      # chart uses it to build resource NAMES. It defaults to the Application
      # name. So without this line the chart rendered a parallel set of objects
      # called platform-apisix-* instead of apisix-*, alongside the ones the
      # install script had created. Duplicate OBJECTS, not duplicate releases.
      #
      # That is why the Application read OutOfSync/Missing rather than
      # conflicting: none of the objects it wanted existed. It then wedged on a
      # pre-upgrade hook Job named platform-apisix-etcd-pre-upgrade whose pod
      # stayed ContainerCreating, waiting on a Secret that only exists under the
      # apisix-* naming.
      #
      # It also means the word "adopt" is loose. Argo CD does not adopt the Helm
      # release -- it starts managing the same OBJECTS while the release Secret
      # sits there, ignored. That leftover Secret is a latent hazard: anyone
      # running `helm upgrade apisix` later becomes a second writer.
      releaseName: apisix
      valuesObject:
        apisix:
          deployment: {mode: traditional}
          prometheus: {enabled: true}
          admin:
            # 0.0.0.0/0 means "any pod in the cluster" -- the Admin API Service
            # is ClusterIP and has no NodePort, deliberately. The chart default
            # of 127.0.0.1/24 blocks the ingress controller, which is the one
            # client that needs it.
            allow: {ipList: ["0.0.0.0/0"]}
            credentials:
              # BOTH SIDES MUST READ THE SAME SECRET.
              #
              # The controller's GatewayProxy already read the key from
              # secret/apisix-admin. The gateway did not -- it fell back to the
              # chart default (edd1c9f0..., published in every APISIX tutorial),
              # so the controller presented one key and the gateway expected
              # another:
              #
              #   SyncFailed  ServerAddr: http://apisix-admin.apisix.svc:9180,
              #   Err: HTTP 500: AxiosError: Request failed with status code 401
              #
              # The gateway was Running, the controller was Running, the route
              # object existed, and nothing served. The failure is only visible
              # in the ApisixRoute's status conditions.
              #
              # secretName/secretAdminKey are IN THE VALUES SCHEMA BUT DO NOT
              # WORK in chart 2.17.0. Set, synced, and the rendered ConfigMap
              # still contained the literal default:
              #
              #   $ kubectl -n apisix get cm apisix -o jsonpath='{.data.config\.yaml}' | grep admin_key
              #   key: edd1c9f034335f136f87ad84b625c8f1
              #
              # No env var, no secret reference on the Deployment. The values
              # exist; the template does not consume them.
              #
              # >>> CURRENT STATE, STATED PLAINLY: the gateway therefore runs on
              # >>> APISIX'S PUBLISHED DEFAULT ADMIN KEY. To get the route
              # >>> serving, secret/apisix-admin was aligned DOWN to that
              # >>> literal so the controller and gateway agree. That is a
              # >>> SECURITY REGRESSION against the generated key, accepted
              # >>> knowingly on a 3-hour throwaway cluster whose Admin API is
              # >>> ClusterIP-only, and it must not be copied anywhere real.
              #
              # The fix is upstream (make the chart honour secretName) or a
              # post-renderer that rewrites the ConfigMap. Neither was done.
              secretName: apisix-admin
              secretAdminKey: key
        replicaCount: 3
        # The chart has NO service.http.nodePort value, so the port is assigned
        # at random (currently 32520) and cannot be pinned from git. The Terraform
        # security-group rule opens 30093, which therefore points at nothing.
        # Reach the gateway with a port-forward, or read the assigned port:
        #   kubectl -n apisix get svc apisix-gateway -o jsonpath='{.spec.ports[0].nodePort}'
        # The imperative installer patches it; the Application cannot.
        service: {type: NodePort}
        resources: {requests: {cpu: 50m, memory: 128Mi}}
        metrics:
          serviceMonitor:
            enabled: true
            namespace: apisix
            # release label so kube-prometheus-stack's default
            # serviceMonitorSelector picks it up. Without it the gateway serves
            # 886 metric lines that nothing scrapes, silently.
            labels: {release: kube-prometheus-stack}
        # BUNDLED ETCD OFF. It is deployed by platform-etcd (wave 5) instead --
        # see 15-etcd.yaml for the two reasons: the bundled one runs an unpinned
        # bitnamilegacy:latest image, and its pre-upgrade hook deadlocks Argo CD
        # on a fresh install.
        etcd:
          enabled: false
        externalEtcd:
          host:
            - http://apisix-etcd.apisix.svc.cluster.local:2379
          # user MUST be empty. It defaults to "root", which makes APISIX try to
          # authenticate against an etcd where RBAC is disabled (see 15-etcd.yaml,
          # auth.rbac.create: false), and the gateway CrashLoopBackOffs with:
          #
          #   got malformed auth message: {"code":9,"message":"etcdserver:
          #   authentication is not enabled"} from .../v3/auth/authenticate
          #
          # The two charts have to agree about whether auth exists. Enabling
          # etcd RBAC and setting a real credential here is the production
          # answer; matching them on "off" is the lab one, stated as such.
          user: ""
          password: ""
  # Needs the external etcd to be serving before APISIX will start.
  # Sync waves order the Applications; they do not wait for readiness, so the
  # gateway may restart a few times while etcd forms quorum. That is expected
  # and self-correcting -- it is not the deadlock described in 15-etcd.yaml,
  # which never resolves.
  #
  # IGNORED ON PURPOSE: the Admin API key.
  #
  # It is generated per-install into secret/apisix-admin and must NOT live in
  # git. Argo CD would otherwise see the chart's default key as desired state
  # and reset it on every sync -- reverting a secret to a published default,
  # which is the worst possible kind of selfHeal.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: apisix
      jsonPointers:
        - /data/config.yaml
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ServerSideDiff, added after researching why every Application in this
      # directory sat permanently OutOfSync.
      #
      # ServerSideApply=true silently ALSO selects the "Structured-Merge Diff"
      # strategy, which the Argo CD docs mark:
      #
      #   Feature Discontinued -- challenges using this strategy to calculate
      #   diffs for CRDs that define default values
      #
      # Measured on this cluster: the etcd StatefulSet differed in 16 fields and
      # 15 were server-side DEFAULTS the chart never sets (dnsPolicy,
      # restartPolicy, schedulerName, terminationGracePeriodSeconds,
      # revisionHistoryLimit, volumeMode, ...). Exactly the described failure.
      #
      # SSA is still needed here -- kube-prometheus-stack and the APISIX CRDs
      # exceed the client-side apply annotation limit -- so the fix is to pair
      # it with the documented replacement diff strategy rather than drop it.
      - ServerSideDiff=true
      # Fail loudly instead of silently clobbering.
      #
      # Two Applications both claimed IngressClass/apisix. Argo CD's default is
      # to apply anyway -- "the last application to sync the resource wins" --
      # and it won: .spec.parameters was blanked, the APISIX controller lost its
      # GatewayProxy reference, and every status stayed green because the
      # gateway kept serving from etcd. Nothing broke visibly; only the ability
      # to apply the NEXT change was gone.
      #
      # FailOnSharedResource turns that into a failed sync. It is a
      # circuit-breaker, not a resolution -- it does not decide ownership -- but
      # given the silent version cost a working control plane, failing loudly is
      # the right default.
      - FailOnSharedResource=true
