# Wave 0. Flagger's request-success-rate comes from this controller's metrics,
# and Argo Rollouts' canary weights are annotations it reads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          replicaCount: 1
          service:
            type: NodePort
            nodePorts: {http: 30090, https: 30443}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          # OFF deliberately. A ValidatingWebhookConfiguration is cluster-scoped
          # and outlives its pods: if this controller is evicted on a tight
          # node, EVERY Ingress apply cluster-wide starts failing -- including
          # the ones Argo Rollouts and Flagger create mid-rollout. Keep it on in
          # production, where the controller is not the thing being evicted.
          admissionWebhooks:
            enabled: false
          # Required by Flagger. Off by default, and its absence produces
          # "no values found for nginx metric request-success-rate", which reads
          # as a Flagger fault.
          metrics:
            enabled: true
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "10254"
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
