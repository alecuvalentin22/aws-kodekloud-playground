# Wave 5. APISIX's config store, deployed SEPARATELY from the APISIX chart.
#
# Two independent reasons, and either alone would justify it.
#
# 1. SECURITY / FRESHNESS. The apisix chart's bundled etcd runs
#    `docker.io/bitnamilegacy/etcd:latest` -- an UNPINNED tag from Bitnami's
#    ARCHIVED catalogue. `latest` means the running version is whatever was
#    pushed most recently and is not recorded anywhere; `bitnamilegacy` means it
#    is the frozen shelf rather than the maintained one. Everything else in this
#    repo is pinned to a current release (see versions.env) and this was the one
#    component quietly not. The bitnami/etcd chart runs a pinned
#    `bitnami/etcd:3.6.4-debian-12-r3`.
#
# 2. IT DEADLOCKS UNDER ARGO CD. The bundled etcd ships a Helm `pre-upgrade`
#    hook. Argo CD maps `pre-install` AND `pre-upgrade` both to `PreSync` and,
#    per its own docs, "cannot know if it is running a first-time install or
#    upgrade -- every operation is a sync". So on a FRESH install it runs a
#    pre-upgrade hook that real Helm would never run. That hook mounts
#    `secret/apisix-etcd-jwt-token`, which is created by the main sync -- which
#    is blocked waiting for the hook. Measured: pod ContainerCreating for 10+
#    minutes, Application stuck OutOfSync/Missing/Running, no error anywhere.
#
#    `preUpgradeJob.enabled: false` below removes the hook entirely.
#
# The apisix chart's own values say the bundled etcd is "only for development
# and testing purposes... if you want to use etcd in production, we recommend
# you install etcd by yourself and use externalEtcd". This is that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-etcd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: apisix
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: etcd
    targetRevision: 12.0.18
    helm:
      releaseName: apisix-etcd
      valuesObject:
        # IMAGE: the honest state of this, because it is a supply-chain fact
        # rather than a preference.
        #
        # Bitnami moved its versioned public images behind a subscription in
        # 2025. Checking the registry directly:
        #
        #   docker.io/bitnami/etcd        NO tags at all -- not even latest
        #   docker.io/bitnamilegacy/etcd  3.6.4-debian-12-r1 .. r4, and latest
        #
        # So the chart's own default (bitnami/etcd:3.6.4-debian-12-r3) is
        # UNPULLABLE -- measured: ImagePullBackOff on all three replicas -- and
        # the archived catalogue is the only place these images still exist.
        # That is why the apisix chart pins bitnamilegacy in the first place.
        #
        # What this still buys over the bundled etcd, which is the point:
        #   bundled   bitnamilegacy/etcd:latest             unpinned
        #   here      bitnamilegacy/etcd:3.6.4-debian-12-r4 pinned, and r4 is
        #                                                   NEWER than the r3
        #                                                   the chart wanted
        #
        # An unpinned tag from an archived repo is the worst case: you cannot
        # say what is running and it will never be patched. Pinned-from-archived
        # is still not good -- it is frozen -- but it is at least KNOWN and
        # reproducible, and check-versions.sh cannot lie about it.
        #
        # The genuinely maintained path is the upstream etcd image
        # (quay.io/coreos/etcd), which this chart cannot use: its entrypoint
        # scripts assume the Bitnami image layout. Moving to it means a
        # different chart. NOT DONE HERE -- recorded as the real remaining risk.
        image:
          registry: docker.io
          repository: bitnamilegacy/etcd
          tag: 3.6.4-debian-12-r4

        # THE LINE THAT BREAKS THE DEADLOCK.
        preUpgradeJob:
          enabled: false
        replicaCount: 3
        auth:
          # No RBAC, matching what the bundled etcd did. The store is reachable
          # only from inside the cluster and holds gateway routes, not secrets.
          # Turn this on for anything real.
          rbac:
            create: false
        persistence:
          enabled: true
          size: 8Gi
        resources:
          requests: {cpu: 50m, memory: 128Mi}
        # etcd is a quorum system: 2 of 3 must stay up through a node drain.
        pdb:
          create: true
          minAvailable: 2
  # WHY THIS APP WAS PERMANENTLY OutOfSync, and why this is the correct fix
  # rather than a suppression.
  #
  # The chart generates a RANDOM JWT signing key into secret/apisix-etcd-jwt-token
  # and stamps a checksum of it onto the pod template, so the Deployment restarts
  # when the secret rotates. That is a sensible pattern and it is also
  # non-deterministic: `helm template` produces a NEW random key every render, so
  # the checksum Argo CD computes never equals the one in the cluster.
  #
  # Diffed offline against the live object -- 16 fields differed, 15 of them
  # server-side defaults the chart never sets, and exactly ONE genuine:
  #
  #   /template/metadata/annotations/checksum/token-secret
  #     live 0c6af36eaa556439...
  #     git  8ae17cd946cf32c2...
  #
  # One genuine diff is enough to mark the whole resource OutOfSync.
  #
  # This is a DOCUMENTED legitimate cause in Argo CD's diffing guide -- "Helm
  # charts that use non-deterministic functions" -- and ignoreDifferences on the
  # specific field is the documented remedy. Note the scope: one annotation on
  # one resource, not a blanket ignore. Widening it would hide the image tag and
  # the replica count, which are exactly what this app exists to control.
  #
  # Suppressing the SYMPTOM here is right because the underlying behaviour is
  # correct: the cluster genuinely does have a key Argo CD cannot know.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: apisix-etcd
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1token-secret

  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - FailOnSharedResource=true
      # ignoreDifferences ALONE was not enough, and the reason is documented:
      # by default it affects only the DIFF, and "during the sync stage, the
      # desired state is applied as-is". So Argo CD stopped REPORTING the
      # checksum difference and kept WRITING it -- pushing a freshly-randomised
      # checksum onto the pod template on every sync.
      #
      # Observed: StatefulSet generation climbed to 4 with pods rolling
      # (ages 5s / 83s / 2m43s) while secret/apisix-etcd-jwt-token's
      # resourceVersion never changed. Argo CD was rolling etcd -- a quorum
      # system -- on a loop, for a value it had been told to ignore.
      #
      # RespectIgnoreDifferences makes ignoreDifferences apply to the sync patch
      # too. That is the pairing: ignoreDifferences to stop reporting it,
      # RespectIgnoreDifferences to stop writing it. Using the first without the
      # second is worse than using neither, because it hides the churn.
      - RespectIgnoreDifferences=true
