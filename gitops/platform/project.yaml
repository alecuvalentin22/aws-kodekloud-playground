# A SEPARATE project from `demo`, and the separation is the point.
#
# The `demo` project is deliberately tight: one namespace, no cluster-scoped
# resources except Namespace itself. The platform cannot live inside that -- it
# installs CRDs, ClusterRoles, StorageClasses, admission configuration. Widening
# `demo` to fit would quietly hand the demo workloads cluster-admin.
#
# So: two projects, and the blast radius of each is stated rather than implied.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster platform -- ingress, observability, gateway, storage

  sourceRepos:
    - https://github.com/alecuvalentin22/aws-kodekloud-playground.git
    - https://kubernetes.github.io/ingress-nginx
    - https://prometheus-community.github.io/helm-charts
    - https://charts.apiseven.com

  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: apisix
    # argocd IS required, and this is the tension the app-of-apps pattern forces
    # on you: the root Application's job is to create child Application objects,
    # and those live in the argocd namespace. Exclude it and the root fails
    # before it does anything:
    #
    #   InvalidSpecError: application destination server '...' and namespace
    #   'argocd' do not match any of the allowed destinations in project
    #   'platform'
    #
    # The dangerous thing was never the namespace, it was what an Application
    # could WRITE there -- Argo CD's own RBAC ConfigMap and its Secrets, which
    # is effectively cluster admin. So allow the namespace and constrain the
    # KINDS instead, with namespaceResourceWhitelist below.
    - server: https://kubernetes.default.svc
      namespace: argocd

  # The real control on the argocd namespace. This project may create exactly
  # these kinds anywhere it is allowed to deploy -- which means it can manage
  # child Applications, and CANNOT touch argocd-cm, argocd-rbac-cm or
  # argocd-secret even though it now has the namespace.
  #
  # A whitelist rather than a blacklist on purpose: a blacklist has to
  # anticipate every dangerous kind, and a chart that adds one later gets it for
  # free.
  namespaceResourceWhitelist:
    - {group: "argoproj.io", kind: Application}
    - {group: "argoproj.io", kind: AppProject}
    - {group: "", kind: Namespace}
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Secret}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "apps", kind: Deployment}
    - {group: "apps", kind: StatefulSet}
    - {group: "apps", kind: DaemonSet}
    - {group: "batch", kind: Job}
    - {group: "batch", kind: CronJob}
    - {group: "policy", kind: PodDisruptionBudget}
    - {group: "networking.k8s.io", kind: Ingress}
    - {group: "networking.k8s.io", kind: NetworkPolicy}
    - {group: "rbac.authorization.k8s.io", kind: Role}
    - {group: "rbac.authorization.k8s.io", kind: RoleBinding}
    - {group: "autoscaling", kind: HorizontalPodAutoscaler}
    - {group: "monitoring.coreos.com", kind: "*"}
    - {group: "apisix.apache.org", kind: "*"}

  # Platform genuinely needs cluster-scoped resources -- but enumerated, not '*'.
  # Anything not on this list is refused at sync with a readable error, which is
  # the behaviour you want the first time a chart quietly adds a MutatingWebhook.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: "storage.k8s.io", kind: StorageClass}
    - {group: "apiextensions.k8s.io", kind: CustomResourceDefinition}
    - {group: "rbac.authorization.k8s.io", kind: ClusterRole}
    - {group: "rbac.authorization.k8s.io", kind: ClusterRoleBinding}
    - {group: "networking.k8s.io", kind: IngressClass}
    - {group: "admissionregistration.k8s.io", kind: ValidatingWebhookConfiguration}
    - {group: "admissionregistration.k8s.io", kind: MutatingWebhookConfiguration}
    # ValidatingAdmissionPolicy / -Binding are the CEL-based admission kinds
    # (GA in 1.30), and they are a DIFFERENT kind from the webhook
    # configurations above -- listing the webhooks does not cover them.
    #
    # Missing them failed the sync outright rather than degrading:
    #
    #   one or more synchronization tasks are not valid:
    #   resource admissionregistration.k8s.io:ValidatingAdmissionPolicy
    #   is not permitted in project platform (retried 5 times)
    #
    # and the Application still reported Healthy, because everything that HAD
    # been applied was fine. Healthy means "what exists is working", not
    # "what git asked for exists". apisix-ingress-controller 2.x ships these to
    # guard Gateway API upgrades.
    #
    # This is the cost of an enumerated whitelist over '*', and it is the cost
    # worth paying: a chart adding a new cluster-scoped kind stops the sync and
    # tells you which kind, instead of silently acquiring it.
    - {group: "admissionregistration.k8s.io", kind: ValidatingAdmissionPolicy}
    - {group: "admissionregistration.k8s.io", kind: ValidatingAdmissionPolicyBinding}
    - {group: "apisix.apache.org", kind: GatewayProxy}
