# The INPUT to both encryption paths. Never committed with real values -- this
# file is the .example, and scripts/secrets-seal.sh reads a copy of it.
apiVersion: v1
kind: Secret
metadata:
  name: demo-credentials
  namespace: demo-secrets
type: Opaque
stringData:
  # podinfo does nothing with these; they exist so that a decrypted Secret can
  # be proved to have decrypted, by reading it back out of the cluster.
  api-token: "replace-me-before-sealing"
  db-password: "replace-me-before-sealing"
