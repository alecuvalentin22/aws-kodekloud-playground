# Flux's Helm story is two objects, and the split is deliberate: the repository
# is a cluster-scoped concern reconciled on its own schedule, the release is a
# workload concern. Ten HelmReleases share one HelmRepository and one poll.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 30m
  url: https://stefanprodan.github.io/podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: demo-helm-flux
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      # KEPT AS A RANGE, deliberately, and it is the only range left in the repo.
      #
      # Everything else is now pinned exactly (see versions.env). This one stays
      # loose because the Argo CD side of the same comparison pins exactly --
      # gitops/helm/argocd/podinfo.yaml is on 6.15.0 -- so the pair demonstrates
      # the actual trade rather than asserting it:
      #
      #   Flux + range   patch releases land with no commit. Good for CVE
      #                  response, and the repository no longer determines
      #                  which version is running.
      #   Argo CD + pin  the cluster moves only when a commit says so, and a
      #                  CVE fix waits for a human.
      #
      # Neither is correct in general. What IS correct is knowing which one you
      # chose -- run `flux get helmrelease -A` and compare the resolved version
      # to what git says.
      version: ">=6.15.0 <7.0.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  # helm-controller runs the same install/upgrade Helm does, but the RETRY
  # behaviour is Flux's own -- and it is what you get instead of a human running
  # `helm upgrade` again.
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      # Roll back to the last working release on a failed upgrade. Helm alone
      # does not do this: `helm upgrade` leaves you in a failed release and
      # waits for someone to notice.
      strategy: rollback
  # OFF BY DEFAULT, and this is the difference people are most often wrong
  # about between the two controllers.
  #
  #   "spec.driftDetection.mode -- If not explicitly set, it defaults to
  #    DiffModeDisabled."
  #
  # Measured: `kubectl scale --replicas=5` on the chart's Deployment stayed at
  # 5 for 180 seconds with the HelmRelease reporting Ready=True throughout,
  # because Ready describes the last `helm upgrade`, not the live objects.
  # Argo CD's selfHeal put the same Deployment back within 10 seconds.
  #
  # Turning it on is necessary but not sufficient to match Argo CD, and the
  # second half matters: correction runs ON THE RECONCILE INTERVAL, not on a
  # watch. At the default 5m interval a hand-edit can persist for five minutes
  # with everything green. Argo CD's selfHeal is event-driven. Hence interval:
  # 1m above -- and even that is a poll.
  driftDetection:
    mode: enabled

  values:
    replicaCount: 2
    ui:
      message: "helm via flux"
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits:   {memory: 128Mi}
    serviceMonitor:
      enabled: false
