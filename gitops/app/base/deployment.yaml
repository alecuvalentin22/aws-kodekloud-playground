apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - {containerPort: 9898, name: http}
          env:
            - name: PODINFO_UI_MESSAGE
              value: "base — this value is overridden per overlay"
          # REQUESTS ARE MANDATORY ON FARGATE, not advisory.
          # Fargate sizes the micro-VM it gives each pod from the sum of its
          # container requests, rounded up to the next valid CPU/memory combo.
          # Omit them and every pod gets the 0.25 vCPU / 0.5 GB minimum -- which
          # is both wasteful and, for anything real, too small.
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 9898}
            initialDelaySeconds: 10
