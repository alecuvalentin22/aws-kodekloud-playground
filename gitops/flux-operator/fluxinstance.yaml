# Flux Operator replaces `flux install` with an object.
#
# `flux install` is imperative: a CLI on someone's laptop renders manifests and
# applies them. Nothing in the cluster records which version was asked for, and
# upgrading means finding the person with the right CLI version. That is an odd
# shape for a tool whose entire pitch is "the cluster matches git".
#
# FluxInstance closes that loop -- Flux's own installation becomes a reconciled
# resource. Change `distribution.version` here, commit, and the operator
# performs the upgrade.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    # Timing, not opt-in. How often the operator re-renders the distribution and
    # re-applies it, and how long it will wait for that to settle.
    #
    # Worth knowing before applying this at all: installing the operator does
    # NOT take over an existing flux-system. Until a FluxInstance exists the
    # operator only OBSERVES -- it publishes a FluxReport that inventories
    # whatever is already running, including a plain `flux install`:
    #
    #   kubectl -n flux-system get fluxreport flux -o yaml
    #   version=v2.9.4 status=Installed
    #   Kustomization: ready=2   GitRepository: ready=1   HelmRelease: ready=1
    #
    # Applying this object is the handover. From here the operator owns the
    # controllers and `flux install` should never be run against this cluster
    # again.
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    # PINNED EXACTLY, changed from the "2.9.x" range this used to carry.
    #
    # A range means the operator can upgrade Flux with no commit, which is
    # convenient and quietly ends "the repository is the source of truth" --
    # the property the rest of this repo exists to demonstrate. Worse for an
    # interview answer: you cannot say which version is running without asking
    # the cluster.
    #
    # The cost of pinning is that it goes stale, and stale means unpatched.
    # ./scripts/check-versions.sh exists to make that cost visible and cheap,
    # so the pin is a deliberate trade rather than neglect.
    version: "2.9.5"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    # image-reflector and image-automation are omitted on purpose: they write
    # commits back to the repository, and this repo is reconciled by Argo CD as
    # well. Two controllers with push access to one branch is a bad idea.
  kustomize:
    patches:
      # The stock controllers request more than a 3-node t3.medium lab wants to
      # give them. Patching here rather than editing rendered manifests is the
      # point of the operator: the change survives an upgrade.
      - target:
          kind: Deployment
          name: "(source-controller|kustomize-controller|helm-controller|notification-controller)"
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/cpu
            value: 20m
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/memory
            value: 64Mi
