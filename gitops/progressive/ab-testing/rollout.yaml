# A/B testing is NOT a canary, and conflating them is the usual mistake.
#
#   canary  -> a PERCENTAGE of traffic, chosen at random per request.
#              The question is "is the new version safe?" and the answer is
#              statistical. Everybody is a potential subject.
#
#   A/B     -> a PREDICATE on the request. Same user, same header, same
#              answer, every time. The question is "does variant B behave
#              differently for the cohort I selected?" -- which requires that
#              the cohort be stable, or the measurement is meaningless.
#
# Argo Rollouts expresses the second with `setHeaderRoute`, and ingress-nginx
# implements it with `canary-by-header`. Weight stays at 0 throughout: no random
# traffic reaches B at all. Only the header does.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  namespace: demo-ab
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{containerPort: 9898}]
          env:
            # podinfo echoes this back on /, so a curl can prove WHICH variant
            # served it -- otherwise "A/B works" is an untestable claim.
            - name: PODINFO_UI_MESSAGE
              value: "variant-A"
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
            initialDelaySeconds: 3
  progressDeadlineSeconds: 300
  strategy:
    canary:
      canaryService: podinfo-canary
      stableService: podinfo-stable
      trafficRouting:
        nginx:
          stableIngress: podinfo
      steps:
        # Scale the canary up WITHOUT giving it any weight. Without this the
        # controller would size the canary ReplicaSet from the weight -- which
        # is 0 -- and the header route would point at zero pods.
        - setCanaryScale:
            replicas: 2
        - setHeaderRoute:
            name: ab-cohort
            match:
              - headerName: X-Cohort
                headerValue:
                  exact: beta
        # An indefinite pause. An A/B test ends when the EXPERIMENT ends -- a
        # human or an analysis decides, not a timer. This is the honest shape:
        # `kubectl argo rollouts promote` to ship B, `abort` to keep A.
        - pause: {}
        # Tearing the route down explicitly is part of the contract. Aborting
        # the rollout also removes it, but leaving it to cleanup means a
        # half-finished experiment can leave a live header route in the ingress.
        - setHeaderRoute:
            name: ab-cohort
        - setWeight: 100
