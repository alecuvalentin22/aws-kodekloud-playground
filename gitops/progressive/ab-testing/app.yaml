apiVersion: v1
kind: Namespace
metadata:
  name: demo-ab
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-stable
  namespace: demo-ab
spec:
  selector: {app: podinfo}
  ports: [{port: 9898, targetPort: 9898, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-canary
  namespace: demo-ab
spec:
  selector: {app: podinfo}
  ports: [{port: 9898, targetPort: 9898, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  namespace: demo-ab
spec:
  ingressClassName: nginx
  rules:
    - host: ab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo-stable
                port: {number: 9898}
