apiVersion: v1
kind: Namespace
metadata:
  name: demo-rollouts-nginx
---
# TWO Services, and the difference between them is the whole point of this
# directory. Both carry a bare `app:` selector; Argo Rollouts appends
# `rollouts-pod-template-hash` to each of them on every step, pinning one to the
# canary ReplicaSet and one to the stable ReplicaSet.
#
# Do not add the hash by hand and do not add it to a kustomize patch -- the
# controller owns that key, and anything else managing it fights the rollout.
apiVersion: v1
kind: Service
metadata:
  name: podinfo-stable
  namespace: demo-rollouts-nginx
spec:
  selector: {app: podinfo}
  ports: [{port: 9898, targetPort: 9898, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-canary
  namespace: demo-rollouts-nginx
spec:
  selector: {app: podinfo}
  ports: [{port: 9898, targetPort: 9898, name: http}]
---
# The stable Ingress. Argo Rollouts CLONES this into podinfo-canary-ingress,
# adds `nginx.ingress.kubernetes.io/canary: "true"`, and rewrites
# `canary-weight` as the steps advance. You never write that second Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  namespace: demo-rollouts-nginx
spec:
  ingressClassName: nginx
  rules:
    - host: rollouts.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo-stable
                port: {number: 9898}
