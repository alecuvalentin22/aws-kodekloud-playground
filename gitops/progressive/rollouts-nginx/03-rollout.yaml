apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  namespace: demo-rollouts-nginx
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports: [{containerPort: 9898}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
            initialDelaySeconds: 3
            # 6s, deliberately generous. The point of scenario 06 part 2 is a
            # release that is HEALTHY BUT TOO SLOW, and a tight probe timeout
            # would turn that into an ordinary unready-pod failure -- which
            # progressDeadlineAbort already catches, making the analysis
            # untestable. A probe answers "is this process alive"; it is not an
            # SLO, and conflating the two is why plenty of latency regressions
            # ship green.
            timeoutSeconds: 6

  # 120s from the last progress before the rollout is considered stuck.
  progressDeadlineSeconds: 120
  # THE LINE THAT WAS MISSING. Without it, hitting the deadline only MARKS the
  # rollout Degraded and leaves the canary in place -- which is what produced
  # "blast radius capped at 25%, but no rollback". With it, the controller
  # aborts: canary scaled down, ingress weight back to 0, traffic on stable.
  progressDeadlineAbort: true

  strategy:
    canary:
      canaryService: podinfo-canary
      stableService: podinfo-stable
      trafficRouting:
        nginx:
          stableIngress: podinfo
      analysis:
        templates:
          - templateName: canary-health
        # startingStep 0, not 1. Analysis then runs in the BACKGROUND from the
        # moment the rollout starts, rather than waiting for a step to be
        # reached. That matters for a release that never becomes ready: the
        # rollout would otherwise stall before step 1 and the analysis would
        # never get a chance to fail it.
        startingStep: 0
      steps:
        - setWeight: 25
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 75
        - pause: {duration: 30s}
