# An AppProject is the SECURITY BOUNDARY, not a folder.
#
# The trap the Argo CD docs call out explicitly: a project whose destinations
# allow the `argocd` namespace grants effective cluster admin, because an
# Application in that project can then reconcile Argo CD's own RBAC ConfigMap
# and Secrets. Note that `destinations` below names exactly one namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Side-by-side GitOps comparison workloads

  sourceRepos:
    - https://github.com/alecuvalentin22/aws-kodekloud-playground.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: demo-argocd

  # Cluster-scoped resources this project may manage.
  #
  # `clusterResourceWhitelist: []` -- deny everything -- is the instinctive
  # choice and it silently breaks `CreateNamespace=true`, because a Namespace
  # IS a cluster-scoped resource:
  #
  #   one or more synchronization tasks are not valid:
  #   resource :Namespace is not permitted in project demo
  #
  # The Application sits OutOfSync/Missing and retries forever. Two settings
  # that are each individually correct and mutually exclusive together.
  #
  # So: allow exactly Namespace, and nothing else. Still no ClusterRole, no CRD,
  # no ValidatingWebhookConfiguration -- which is the actual point of the
  # restriction.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}

  # Surface anything living in the namespace that Git does not know about,
  # rather than silently tolerating it.
  orphanedResources:
    warn: true
